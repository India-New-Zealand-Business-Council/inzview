<!-- Paste into the Home page via Add > Embed > Embed HTML -->
<!-- Full-bleed subscribe band. Deliberately the only warm band on the page, so it reads as
     the one standing offer rather than another section. -->

<section class="inz-section inz-section--accent">
  <div class="inz-container inz-split inz-split--device">
    <div>
      <h2>Subscribe to the INZBC newsletter</h2>
      <p>Trade news, FTA developments and event announcements, straight to your inbox.</p>
      <div class="inz-actions">
        <a href="LINK_SUBSCRIBE" class="inz-btn inz-btn--onaccent">Subscribe</a>
        <a href="/newsletters" onclick="inzNav(event, '/newsletters')" class="inz-btn inz-btn--onaccent-ghost">View the archive</a>
      </div>
    </div>
    <figure class="inz-device par" data-p="0.26">
      <img src="IMG_NEWSLETTER_MOCKUP" alt="The INZBC newsletter shown on a laptop and a tablet" loading="lazy">
    </figure>
  </div>
</section>
