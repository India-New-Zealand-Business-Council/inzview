<!-- Paste into Studio editor: Settings > Custom Code > Add to Head -->
<!-- Loads brand fonts and sets global CSS variables. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,400..900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --inz-navy: #1b1464;
    --inz-blue: #097bb8;
    --inz-purple: #1b1464;
    --inz-crimson: #d0611d;
    --inz-tangerine: #f8c70c;
    --inz-forest: #097bb8;
    --inz-lavender: #9fb6e8;
    --inz-lime: #f8c70c;
    --inz-white: #ffffff;
    --inz-light: #f6f5f8;
    --inz-max-width: 1160px;
    --inz-radius: 10px;
  }

  /* Base typography — scoped so it does not fight Wix Studio UI */
  .inz-section {
    font-family: 'Merriweather', Georgia, serif;
    color: var(--inz-navy);
    line-height: 1.6;
  }

  .inz-section h1,
  .inz-section h2,
  .inz-section h3,
  .inz-section .inz-heading {
    font-family: 'Big Shoulders', Impact, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.05;
    margin: 0 0 0.4em;
  }

  .inz-section h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); }
  .inz-section h2 { font-size: clamp(2rem, 4.5vw, 3.25rem); }
  .inz-section h3 { font-size: clamp(1.5rem, 3vw, 2rem); }

  .inz-section p {
    max-width: 68ch;
    margin: 0 0 1em;
  }

  /* Gold fill with indigo text is 9.89:1. Never orange #d0611d: 4.07:1, fails AA. */
  .inz-btn {
    display: inline-block;
    font-family: 'Big Shoulders', Impact, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 0.85em 1.6em;
    border-radius: var(--inz-radius);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .inz-btn:focus-visible {
    outline: 3px solid var(--inz-lavender);
    outline-offset: 3px;
  }

  .inz-btn--primary {
    background-color: var(--inz-tangerine);
    color: var(--inz-navy) !important;
  }

  .inz-btn--secondary {
    background-color: transparent;
    color: var(--inz-navy);
    box-shadow: inset 0 0 0 2px currentColor;
  }

  .inz-btn:hover {
    transform: translateY(-2px);
    opacity: 0.92;
  }

  /* Container */
  .inz-container {
    width: min(92%, var(--inz-max-width));
    margin-inline: auto;
  }

  /* Utility */
  .inz-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
