<!-- Paste into the Home page via Add > Embed > Embed HTML -->
<!-- The Annual Summit band from the live site: summit on one side, the report spread on
     the other. Full bleed, so it breaks the centred column the rest of the page keeps. -->

<section class="inz-section inz-section--dark inz-section--compact">
  <div class="inz-glow inz-glow--right inz-glow--accent par" data-p="0.3"></div>
  <div class="inz-container inz-split inz-split--even">
    <div>
      <p class="inz-kick">INZBC Annual Summit</p>
      <h2>New Zealand's premier India trade event</h2>
      <p>Bringing together business leaders, policymakers and government representatives from both countries.</p>
      <div class="inz-actions">
        <a href="/events" onclick="inzNav(event, '/events')" class="inz-btn inz-btn--primary">See upcoming events</a>
        <a href="/events/past" onclick="inzNav(event, '/events/past')" class="inz-btn inz-btn--secondary">Past events</a>
      </div>
    </div>
    <figure class="inz-spread par" data-p="0.18">
      <img src="IMG_MAGAZINE_SPREAD" alt="Spread from the INZBC report showing photography and articles from the annual summit" loading="lazy">
    </figure>
  </div>
</section>
